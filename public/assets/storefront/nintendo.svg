<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <!-- Official Vibrant Nintendo Red Card -->
  <rect width="240" height="240" rx="28" fill="#E60012"/>
  <!-- Nintendo Switch Official Joy-Con Emblem -->
  <g>
    <!-- Left Joy-Con -->
    <path fill="#FFFFFF" d="M113 34H97C85.5 34 76 43.5 76 55V85C76 96.5 85.5 106 97 106H113V34ZM104 95H97C91.5 95 87 90.5 87 85V55C87 49.5 91.5 45 97 45H104V95Z"/>
    <circle cx="97" cy="58" r="5" fill="#FFFFFF"/>
    <!-- Right Joy-Con -->
    <path fill="#FFFFFF" d="M127 34H143C154.5 34 164 43.5 164 55V85C164 96.5 154.5 106 143 106H127V34Z"/>
    <circle cx="143" cy="82" r="5.5" fill="#E60012"/>
  </g>
  <!-- NINTENDO SWITCH Official Typography -->
  <text x="120" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="20" letter-spacing="3.5" fill="#FFFFFF" text-anchor="middle">NINTENDO</text>
  <text x="120" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="20" letter-spacing="3.5" fill="#FFFFFF" text-anchor="middle">SWITCH</text>
  <!-- eShop Card Badge -->
  <g transform="translate(60, 178)">
    <rect width="120" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="60" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">eShop Card</text>
  </g>
</svg>
