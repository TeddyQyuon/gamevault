# GameVault production stack: Caddy (auto-HTTPS) + storefront + API + MySQL.
#
# Run from this directory:
#   1. cp .env.prod.example .env.prod   # fill in secrets (NEVER commit it)
#   2. DOMAIN=shop.example.com docker compose --env-file .env.prod up -d --build
#
# The api container runs migrations on every boot, then starts Express.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: gamevault
      MYSQL_USER: gv
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      CLIENT_URL: https://${DOMAIN:?DOMAIN is required}
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: gamevault
      DATABASE_USER: gv
      DATABASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      CODES_ENCRYPTION_KEY: ${CODES_ENCRYPTION_KEY:?CODES_ENCRYPTION_KEY is required}
      COOKIE_SECURE: 'true'
    depends_on:
      mysql:
        condition: service_healthy
    command: ['sh', '-c', 'node src/migrate.js && node src/index.js']

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
